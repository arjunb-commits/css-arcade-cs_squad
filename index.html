<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Arcade Cabinet — Activity 05 build challenge: a neon Tic-Tac-Toe machine">
  <title>Neon Tic-Tac-Toe Cabinet · CS Squad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap">
  <!--
    Activity 05 · CSS Arcade Night · Round 3 Build
    Team Name: CS Squad
    Members / IDs: Arjun Baskar / 002493031
    Theme: Retro Tic-Tac-Toe Cabinet
  -->
  <style>
    :root {
      --bg: #0c0a1a;
      --surface: #16132b;
      --ink: #f8fafc;
      --neon-pink: #f472b6;
      --neon-cyan: #22d3ee;
      --gold: #fde047;
      --radius: 14px;
      --space: 1rem;
      --pixel: "Press Start 2P", "Courier New", monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 0%, rgba(244, 114, 182, 0.18), transparent 45%),
        radial-gradient(circle at 85% 100%, rgba(34, 211, 238, 0.16), transparent 45%),
        var(--bg);
      background-attachment: fixed;
      color: var(--ink);
      line-height: 1.5;
    }

    h1, h2 { font-family: var(--pixel); font-weight: 400; line-height: 1.6; }
    h2 { font-size: 1rem; margin-bottom: var(--space); color: var(--neon-cyan); }
    a { color: var(--ink); }

    .cabinet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--space);
      padding: var(--space) 2rem;
      border-bottom: 3px solid var(--neon-pink);
      box-shadow: 0 6px 24px rgba(244, 114, 182, 0.35);
    }

    .logo { font-size: clamp(0.8rem, 2.2vw, 1.1rem); color: var(--neon-pink); }

    .cabinet-nav {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 1.5rem;
    }

    .cabinet-nav a {
      font-family: var(--pixel);
      font-size: 0.7rem;
      text-decoration: none;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .cabinet-nav a:hover,
    .cabinet-nav a:focus-visible {
      transform: translateY(-3px);
      box-shadow: 0 0 14px var(--neon-cyan);
      outline: 2px solid var(--neon-cyan);
    }

    main {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 2rem;
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 var(--space);
    }

    #play { grid-row: span 2; }

    section {
      background: rgba(22, 19, 43, 0.6);
      border: 2px solid rgba(34, 211, 238, 0.35);
      border-radius: var(--radius);
      padding: 1.5rem;
    }

    .game-grid {
      position: relative;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 10px;
      max-width: 380px;
      margin: 0 auto;
    }

    .tile {
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      background: var(--surface);
      border: 2px solid rgba(248, 250, 252, 0.12);
      border-radius: var(--radius);
      padding: var(--space);
      min-height: 100px;
      font-family: var(--pixel);
      font-size: clamp(1.6rem, 6vw, 2.6rem);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .tile.x { color: var(--neon-pink); text-shadow: 0 0 12px var(--neon-pink); }
    .tile.o { color: var(--neon-cyan); text-shadow: 0 0 12px var(--neon-cyan); }

    .win-line {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 5;
      width: 132%;
      height: 8px;
      border-radius: 4px;
      background: var(--gold);
      box-shadow: 0 0 16px var(--gold);
      pointer-events: none;
      transform: translate(-50%, -50%) rotate(45deg);
      animation: drawLine 1s ease-out 1.5s both;
    }

    .marquee-text {
      font-size: clamp(1rem, 3vw, 1.5rem);
      text-align: center;
      animation: attractMode 1.2s ease-in-out 0.5s both;
    }

    @keyframes attractMode {
      0%   { transform: translateY(-24px) scale(0.85); color: var(--neon-pink); }
      50%  { transform: translateY(8px) scale(1.08); color: var(--neon-cyan); }
      100% { transform: translateY(0) scale(1); color: var(--gold); }
    }

    @keyframes drawLine {
      0%   { transform: translate(-50%, -50%) rotate(45deg) scaleX(0); background: var(--neon-pink); }
      50%  { transform: translate(-50%, -50%) rotate(45deg) scaleX(0.6); background: var(--neon-cyan); }
      100% { transform: translate(-50%, -50%) rotate(45deg) scaleX(1); background: var(--gold); }
    }

    .score-list { list-style: none; font-family: var(--pixel); font-size: 0.75rem; }

    .score-list li {
      padding: 0.75rem 0;
      border-bottom: 1px dashed rgba(248, 250, 252, 0.2);
    }

    .layer-stack {
      position: relative;
      min-height: 260px;
      max-width: 340px;
      margin: 0 auto;
    }

    .layer {
      position: absolute;
      display: grid;
      place-items: center;
      border-radius: var(--radius);
      font-family: var(--pixel);
    }

    .layer-back {
      top: 0; left: 0; z-index: 1;
      width: 60%; height: 65%;
      background: var(--neon-pink);
      color: var(--bg);
      font-size: 3rem;
    }

    .layer-mid {
      top: 18%; left: 30%; z-index: 2;
      width: 60%; height: 65%;
      background: var(--neon-cyan);
      color: var(--bg);
      font-size: 3rem;
      box-shadow: 0 0 20px rgba(12, 10, 26, 0.6);
    }

    .layer-front {
      bottom: 0; left: 8%; z-index: 3;
      width: 84%; height: 34%;
      background: var(--gold);
      color: var(--bg);
      font-size: 0.8rem;
      text-align: center;
      box-shadow: 0 0 24px var(--gold);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .tile:hover,
    .tile:focus-visible {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 0 18px var(--neon-cyan);
      outline: 2px solid var(--neon-cyan);
    }

    .layer-front:hover { transform: rotate(-3deg) scale(1.04); box-shadow: 0 0 36px var(--gold); }

    .cabinet-footer {
      text-align: center;
      padding: 2rem var(--space);
      font-size: 0.85rem;
      opacity: 0.7;
    }

    @media (max-width: 768px) {
      .cabinet-header { flex-direction: column; padding: var(--space); }
      .cabinet-nav { flex-wrap: wrap; justify-content: center; gap: 0.5rem; }
      main { grid-template-columns: 1fr; }
      #play { grid-row: auto; }
      .tile { min-height: 0; padding: 0.25rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .marquee-text, .win-line { animation: none; }
      .tile, .cabinet-nav a, .layer-front { transition: none; }
    }
  </style>
</head>
<body>
  <header class="cabinet-header">
    <h1 class="logo">🕹️ Neon Tic-Tac-Toe</h1>
    <nav class="cabinet-nav" aria-label="Cabinet">
      <a href="#play">Play</a>
      <a href="#scores">High Scores</a>
      <a href="#merch">Winner</a>
    </nav>
  </header>

  <main>
    <section id="play" aria-labelledby="play-title">
      <h2 id="play-title" class="marquee-text">Press Start</h2>
      <div class="game-grid">
        <div class="tile x" tabindex="0">X</div>
        <div class="tile o" tabindex="0">O</div>
        <div class="tile x" tabindex="0">X</div>
        <div class="tile o" tabindex="0">O</div>
        <div class="tile x" tabindex="0">X</div>
        <div class="tile o" tabindex="0">O</div>
        <div class="tile o" tabindex="0">O</div>
        <div class="tile" tabindex="0"></div>
        <div class="tile x" tabindex="0">X</div>
        <span class="win-line" aria-hidden="true"></span>
      </div>
    </section>

    <section id="scores" aria-labelledby="scores-title">
      <h2 id="scores-title">High Scores</h2>
      <ol class="score-list">
        <li>AAA · 9,999</li>
        <li>BBB · 7,500</li>
        <li>CCC · 5,000</li>
      </ol>
    </section>

    <section id="merch" aria-labelledby="merch-title">
      <h2 id="merch-title">Player 1 Wins</h2>
      <div class="layer-stack">
        <div class="layer layer-back">X</div>
        <div class="layer layer-mid">O</div>
        <div class="layer layer-front">PLAYER 1 WINS</div>
      </div>
    </section>
  </main>

  <footer class="cabinet-footer">
    <p>&copy; 2026 CS Squad · Activity 05</p>
  </footer>
</body>
</html>
